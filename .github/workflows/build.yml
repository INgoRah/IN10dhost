name: build

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        cc: [""]
        include:
        - os: ubuntu-latest
          cc: CC=/usr/bin/gcc-14
          setup: sudo apt-get install -y gcc-14 fuse3
    steps:
    - uses: actions/checkout@v2
    - name: setup
      if: ${{ matrix.setup }}
      run: ${{ matrix.setup }}
    - name: install dependencies on Linux
      if: runner.os == 'Linux'
      run: sudo apt-get install -y fuse3 libfuse3-dev nlohmann-json3-dev libgtest-dev libgmock-dev lcov

    - name: Cache quickjs-ng
      id: qjs-cache
      uses: actions/cache@v4
      with:
        path: ~/qjs-install
        key: quickjs-ng-v0.15.1-${{ runner.os }}

    - name: Build quickjs-ng
      if: steps.qjs-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch v0.15.1 https://github.com/quickjs-ng/quickjs.git /tmp/quickjs
        cmake -S /tmp/quickjs -B /tmp/quickjs/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_INSTALL_PREFIX=$HOME/qjs-install
        cmake --build /tmp/quickjs/build -j"$(nproc)"
        cmake --install /tmp/quickjs/build

    - name: Install quickjs-ng
      run: |
        sudo cp -r ~/qjs-install/. /usr/local/
        sudo ldconfig
    - name: configure
      run: ${{ matrix.cc }} mkdir build;cmake -DUSE_GPIO=NO -DUSE_I2C=NO -DTESTING=ON -DNO_TERM=ON -DCMAKE_BUILD_TYPE=Debug -S . -B build
    - name: make
      run: cmake --build build -- -j$(nproc)
    - name: check
      env:
        CLICOLOR_FORCE: "1"
      run: build/bin/in10dfs
    - name: Gen Coverage Report
      run: lcov --capture -q --directory build/ --include "src" --ignore-errors inconsistent,inconsistent  --output-file coverage.info
    - name: Gen HTML Report
      run: genhtml coverage.info -q -ignore-errors inconsistent,inconsistent --output-directory htmlcov
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: detailed-coverage-report
        path: htmlcov/
    - name: Check Coverage Threshold
      uses: tluijken/code-coverage-threshold@v1
      with:
        coverage-file: coverage.info # Path to your LCOV file
        minimum-coverage: 80              # Fails if below 80%
    - name: Clang Static Analyzer
      run: |
        sudo apt-get install -y clang clang-tools
        mkdir -p build-analyze
        cmake -DUSE_GPIO=NO -DUSE_I2C=NO -DTESTING=OFF -DCMAKE_BUILD_TYPE=Debug -S . -B build-analyze
        SCAN_BUILD=$(command -v scan-build || ls /usr/bin/scan-build-* | sort -V | tail -n1)
        "$SCAN_BUILD" --use-cc=clang --use-c++=clang++ --status-bugs -o scan-report cmake --build build-analyze
    - name: Upload Clang Analysis Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clang-analysis-report
        path: scan-report/
        if-no-files-found: ignore
    - name: configure for coverity
      run: |
        mkdir -p build-cov
        cmake -DUSE_GPIO=NO -DUSE_I2C=YES -DTESTING=OFF -DCMAKE_BUILD_TYPE=Release -S . -B build-cov

    - name: Run Coverity Scan
      uses: vapier/coverity-scan-action@v1
      with:
        email: ${{ secrets.COVERITY_SCAN_EMAIL }}
        token: ${{ secrets.COVERITY_TOKEN }}
        command: |
          cov-configure --compiler g++ --comptype gcc
          cov-configure --compiler c++ --comptype gcc
          cmake --build build-cov --target clean || true
          cov-build --dir cov-int cmake --build build-cov
          cov-manage-emit --dir cov-int --tu-pattern "file('/usr/')" delete || true